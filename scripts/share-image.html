<!DOCTYPE html>
<!-- Source of assets/social/ja-logistica-*.jpg. Open at 1200x630 and capture the viewport. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Imagem de compartilhamento</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d2a33; }
  .card { position: relative; width: 1200px; height: 630px; color: #fff; font-family: Inter, sans-serif; }
  .photo { position: absolute; inset: 0 0 0 360px; background: url(../assets/img/transporte-conteiner-carreta-1600.webp) center / cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0d2a33 0, #0d2a33 34%, rgba(13, 42, 51, .82) 52%, rgba(13, 42, 51, .1) 82%); }
  .copy { position: absolute; left: 64px; top: 48px; bottom: 48px; width: 640px; display: flex; flex-direction: column; }
  .logo { width: 128px; padding: 12px 16px; border-radius: 14px; background: #fff; }
  .logo img { display: block; width: 100%; }
  h1 { margin: auto 0 22px; font-family: Poppins, sans-serif; font-size: 52px; font-weight: 800; line-height: 1.08; letter-spacing: -1.5px; }
  h1 span { color: #f5891f; }
  p { margin: 0; color: #d1e0e5; font-size: 24px; font-weight: 500; line-height: 1.45; }
  .site { margin-top: 30px; color: #ffbf7b; font-size: 20px; font-weight: 600; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #f5891f; }
</style>
</head>
<body>
<div class="card">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="logo"><img src="../assets/logos/logo-jalogistica-240.png" alt=""></div>
    <h1>Transporte de cargas especiais e contêineres <span>no Nordeste.</span></h1>
    <p>Frota própria, armazenagem e terminal<br>em Caucaia (CE).</p>
    <div class="site">www.jalogisticas.com</div>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
